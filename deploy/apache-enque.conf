# /etc/apache2/sites-available/enque.conf のサンプル（Debian 12 / Apache 2.4）
#
#   a2enmod rewrite
#   a2ensite enque && systemctl reload apache2
#
# DocumentRoot は必ず public/ を指すこと。src/ sql/ bin/ logs/ storage/ .env は
# ドキュメントルートの外にあるため、Web からは直接参照できない。
# 壁紙画像は storage/ に置き、wallpaper_file.php（全体アンケート回答者のみ）経由で配信する。

<VirtualHost *:80>
    ServerName survey.example.jp
    DocumentRoot /var/www/enque/public

    <Directory /var/www/enque/public>
        Options -Indexes +FollowSymLinks
        # /s/<イベント>/<企業> の書き換えに .htaccess を使うため All にする
        AllowOverride All
        Require all granted
    </Directory>

    # 多層防御：万一 public 以外が公開領域に入っても拒否する
    <Directory /var/www/enque/src>
        Require all denied
    </Directory>
    <Directory /var/www/enque/sql>
        Require all denied
    </Directory>
    <Directory /var/www/enque/bin>
        Require all denied
    </Directory>
    <Directory /var/www/enque/logs>
        Require all denied
    </Directory>
    <Directory /var/www/enque/storage>
        Require all denied
    </Directory>

    # 壁紙のアップロードに合わせて上限を調整する（既定は 2M で足りないことがある）
    <IfModule mod_php.c>
        php_value upload_max_filesize 12M
        php_value post_max_size 13M
    </IfModule>

    # php-fpm を使う場合（推奨）
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    # DB接続情報・SMTP認証情報は .env で渡す運用を推奨。
    # SetEnv は設定ファイルに平文で残るため、ファイル権限に注意すること。
    #   SetEnv DB_HOST 127.0.0.1
    #   SetEnv DB_NAME enque
    #   SetEnv DB_USER enque_app
    #   SetEnv DB_PASS ********
    #   SetEnv BASE_URL https://survey.example.jp
    #   SetEnv SESSION_SECURE 1
    #   SetEnv DISPLAY_ERRORS 0

    ErrorLog  ${APACHE_LOG_DIR}/enque_error.log
    CustomLog ${APACHE_LOG_DIR}/enque_access.log combined
</VirtualHost>

# HTTPS で運用する場合は上記を *:443 + SSLEngine on に置き換え、
# .env の SESSION_SECURE=1 を設定してセッションCookieに Secure 属性を付けること。
# QRコードに埋め込むURLは BASE_URL（https://…）で決まるため、印刷前に必ず設定する。

# 同時アクセスの目安（各社400名／全体で延べ3,000名）に対しては、
# php-fpm のプロセス数を次のように増やしておく（/etc/php/8.4/fpm/pool.d/www.conf）:
#   pm = dynamic
#   pm.max_children = 40
#   pm.start_servers = 8
#   pm.min_spare_servers = 6
#   pm.max_spare_servers = 16
# 事前に bin/bench.php で回答送信の負荷試験を行い、実測に合わせて調整すること。
